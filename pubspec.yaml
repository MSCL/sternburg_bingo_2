name: sternburg_bingo_2
description: "A Flutter project in the context of the famous Sternburg Bingo."
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Logging & Storage
  logger: ^2.8.0
  shared_preferences: ^2.5.6

  # Icons
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
